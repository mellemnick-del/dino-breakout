name: App Store screenshots

# Builds the game for the simulator, launches it in screenshot mode on an
# iPhone (6.3 inch) and an iPad (13 inch), and saves the raw screenshots to
# the `screenshots` branch. Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project DinoBreakout.xcodeproj -target DinoBreakout -configuration Debug \
            -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E -A4 "error:" build.log | head -80; exit 1; }
          tail -5 build.log

      - name: Take screenshots
        timeout-minutes: 25
        run: |
          set -e
          APP="build/Debug-iphonesimulator/DinoBreakout.app"
          BUNDLE="com.nickmellem.dinobreakout"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Simulator SDK $SDK"
          mkdir -p shots

          # A simulator with this name on the runtime that matches the SDK we built with
          udid_for() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          sdk = sys.argv[1].split(".")
          wanted = sys.argv[2:]
          runtimes = json.load(sys.stdin)["devices"]
          exact = "iOS-" + "-".join(sdk[:2])
          major = "iOS-" + sdk[0] + "-"
          for test in (lambda k: k.endswith(exact), lambda k: major in k, lambda k: "iOS" in k):
              for name in wanted:
                  for key, devices in runtimes.items():
                      if not test(key):
                          continue
                      for d in devices:
                          if d["name"] == name:
                              print(d["udid"], key, file=sys.stderr)
                              print(d["udid"]); sys.exit(0)
          sys.exit(1)' "$SDK" "$@"
          }

          shoot() {
            local folder="$1"; shift
            local udid
            udid=$(udid_for "$@")
            echo "$(date +%T) booting $folder $udid"
            xcrun simctl boot "$udid" || true
            for i in $(seq 1 60); do
              if xcrun simctl list devices | grep "$udid" | grep -q Booted; then break; fi
              sleep 5
            done
            sleep 20
            echo "$(date +%T) installing"
            xcrun simctl install "$udid" "$APP"
            mkdir -p "shots/$folder"
            # scene, seconds to let it play out
            for spec in "1 18" "2 30" "3 18" "4 6" "5 8"; do
              set -- $spec
              local args=(-shot "$1" -tutorialDone YES)
              if [ "$1" != "5" ]; then args+=(-testMode YES); fi
              echo "$(date +%T) scene $1"
              xcrun simctl launch --terminate-running-process "$udid" "$BUNDLE" "${args[@]}"
              sleep "$2"
              xcrun simctl io "$udid" screenshot "shots/$folder/$1.png"
            done
            xcrun simctl shutdown "$udid" || true
          }

          shoot iphone "iPhone 16 Pro" "iPhone 17 Pro" "iPhone 15 Pro"
          shoot ipad "iPad Pro 13-inch (M4)" "iPad Pro 13-inch (M5)"
          ls -R shots

      - name: Save to the screenshots branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rf --cached . > /dev/null
          git add shots
          git commit -m "Raw App Store screenshots"
          git push -f origin screenshots
